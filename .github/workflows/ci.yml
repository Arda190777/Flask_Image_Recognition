name: Software Quality CI

on:
  push:
    branches:
      - assignment-2-arda
  pull_request:
    branches:
      - assignment-2-arda

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install quality tools
        run: python -m pip install pylint==4.1.2 pytest==9.1.1

      - name: Run Pylint
        run: pylint app.py model.py tests

      - name: Run Pytest
        run: pytest -v
